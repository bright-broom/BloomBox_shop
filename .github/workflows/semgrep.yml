name: Semgrep CE

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: JavaScript and TypeScript security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.172.0
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan source and workflows
        run: >-
          semgrep scan
          --config auto
          --error
          --exclude node_modules
          --exclude .next
          .
