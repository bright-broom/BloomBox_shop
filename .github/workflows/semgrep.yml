name: Semgrep CE

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: JavaScript and TypeScript security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan source and workflows
        run: >-
          semgrep scan
          --config .semgrep.yml
          --error
          --exclude node_modules
          --exclude .next
          .
