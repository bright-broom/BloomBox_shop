name: CI failure triage

on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify affected pull requests
        uses: actions/github-script@v9
        with:
          script: |
            const marker = "<!-- bloombox-ci-failure -->";
            const run = context.payload.workflow_run;
            const body = `${marker}\n⚠️ **${run.name}** failed for \`${run.head_sha.slice(0, 7)}\`. `
              + `[Open the failed run](${run.html_url}) to inspect logs and prepare a focused fix.`;

            for (const pullRequest of run.pull_requests) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                per_page: 100,
              });
              const existing = comments.find((comment) =>
                comment.user?.type === "Bot" && comment.body?.includes(marker),
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  body,
                });
              }
            }
