version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      # pnpm-workspace.yaml exempts only the reviewed PR #18 baseline versions
      # from pnpm's resolver gate; future releases still wait seven days.
    ignore:
      # The architecture checker uses the TypeScript 5 JavaScript compiler API.
      # Upgrade the compiler in a dedicated tooling migration.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Keep Node types aligned with the Node 24 CI/runtime baseline.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
